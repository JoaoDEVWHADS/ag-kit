name: Apply AG Kit Release Payload

on:
  push:
    branches:
      - automation/agkit-next-20260721
    paths:
      - '.github/workflows/apply-release-payload.yml'

permissions:
  contents: write

concurrency:
  group: apply-agkit-release-payload
  cancel-in-progress: false

jobs:
  apply:
    name: Apply production documentation payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/agkit-next-20260721
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Decode and verify release payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/agkit-release-payload.part00 \
            .github/agkit-release-payload.part01 \
            .github/agkit-release-payload.rempart00 \
            .github/agkit-release-payload.rempart01 \
            .github/agkit-release-payload.rempart02 \
            .github/agkit-release-payload.rempart03 \
            .github/agkit-release-payload.rempart04 \
            | base64 --decode > /tmp/agkit-release-payload.tar.gz
          echo '13689fd982000090b335f51ad67fc339abf3d3bad9c62737ae8080b5ecd9002c  /tmp/agkit-release-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/agkit-release-payload.tar.gz -C .

      - name: Synchronize package locks and web changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path('package.json').read_text('utf-8'))['version']
          for filename in ('package-lock.json', 'cli/package-lock.json', 'web/package-lock.json'):
              path = Path(filename)
              data = json.loads(path.read_text('utf-8'))
              data['version'] = version
              root = data.get('packages', {}).get('')
              if isinstance(root, dict):
                  root['version'] = version
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', 'utf-8')

          path = Path('web/src/services/changelog.json')
          data = json.loads(path.read_text('utf-8'))
          if not data or data[0].get('version') != version:
              data.insert(0, {
                  'version': version,
                  'date': '2026-07-21',
                  'summary': 'Production candidate for the Antigravity-first runtime: native discovery, MCP planning, safety hooks, orchestration, deterministic plugin packaging, diagnostics, migration guidance, and release gates.',
                  'changes': {
                      'Added': [
                          'Antigravity runtime contract, Doctor, native hook schemas, MCP synchronization helper, plugin builder, and regression tests.',
                          'English and Vietnamese production guides, migration and rollback instructions, security threat model, and production checklist.'
                      ],
                      'Changed': [
                          'Google Antigravity is the primary supported runtime for AG Kit.',
                          'Root, CLI, web, and toolkit versions are aligned at 2026.7.21.',
                          'Plugin inventory generation is deterministic and the managed integrity lock covers runtime and hook files.'
                      ],
                      'Security': [
                          'A narrow PreToolUse gate blocks high-confidence destructive root and raw-disk commands without replacing Antigravity permission controls.',
                          'MCP synchronization remains explicit, refuses placeholder credentials, preserves conflicts by default, and creates backups before writes.'
                      ]
                  }
              })
          path.write_text(json.dumps(data, indent=4, ensure_ascii=False) + '\n', 'utf-8')
          PY

      - name: Generate managed metadata
        run: |
          python .agents/scripts/generate_manifest.py .agents
          python .agents/scripts/dependency_graph.py .agents

      - name: Validate release candidate
        run: |
          python .agents/scripts/validate_kit.py .agents
          node .agents/hooks/antigravity-doctor.mjs
          node --test .agents/hooks/tests/antigravity.test.mjs
          node .agents/hooks/build-plugin.mjs --output .tmp/antigravity-plugin

      - name: Remove one-time staging files
        shell: bash
        run: |
          rm -f \
            .github/agkit-release-payload.part00 \
            .github/agkit-release-payload.part01 \
            .github/agkit-release-payload.rempart00 \
            .github/agkit-release-payload.rempart01 \
            .github/agkit-release-payload.rempart02 \
            .github/agkit-release-payload.rempart03 \
            .github/agkit-release-payload.rempart04 \
            .github/workflows/apply-release-payload.yml
          rm -rf .tmp

      - name: Commit production candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release changes to commit.'
            exit 0
          fi
          git commit -m 'docs(release): prepare Antigravity 2026.7.21 production candidate'
          git push origin HEAD:automation/agkit-next-20260721
